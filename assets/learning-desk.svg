    <text x="35" y="143" font-family="Georgia, serif" font-size="16" fill="#345243">imagine</text>
    <text x="35" y="169" font-family="Georgia, serif" font-size="16" fill="#345243">explore</text>
    <text x="35" y="195" font-family="Georgia, serif" font-size="16" fill="#345243">understand</text>
    <path d="M165 137L170 142L181 130M165 163L170 168L181 156M165 189L170 194L181 182" stroke="#75916a" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="250" y="56" font-family="Georgia, serif" font-size="25" fill="#345243">y = x + 1</text>
    <path d="M266 209V110M260 120L266 110L272 120M266 209H389M379 203L389 209L379 215" stroke="#819178" stroke-width="1.2" stroke-linejoin="round"/>
    <path d="M274 193L298 176L324 159L348 142L376 122" stroke="#b67d3e" stroke-width="2.5" stroke-linecap="round"/>
    <circle cx="298" cy="176" r="4" fill="#b67d3e"/><circle cx="348" cy="142" r="4" fill="#b67d3e"/>
    <text x="286" y="247" font-family="Georgia, serif" font-style="italic" font-size="12" fill="#6c7f63">one step at a time</text>
    <path d="M34 235C50 225 63 233 76 225" stroke="#a0ae90" stroke-width="1.5" stroke-linecap="round"/>
  </g>

  <!-- A science note tucked into the top of the composition. -->
  <g transform="translate(348 95) rotate(10 73 60)" filter="url(#shadow)">
    <rect width="147" height="116" rx="2" fill="#f4d88e"/>
    <rect x="49" y="-8" width="51" height="17" fill="#d5d9bb" opacity="0.85"/>
