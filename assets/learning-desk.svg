  </defs>
  <!-- A composed study desk, drawn as vectors so it stays sharp at any size. -->
  <path d="M86 141C128 83 225 84 305 99C380 113 491 116 536 188C584 264 564 407 491 473C420 537 266 554 158 502C60 455 36 329 50 236C55 202 66 168 86 141Z" fill="#e5e9d9"/>
